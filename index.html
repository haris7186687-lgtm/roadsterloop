<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don’t Touch Red!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#10061f;--bg2:#2a0f4d;--g:#31ff8f;--r:#ff2a55;--y:#ffd43b;--t:#fff;--m:#b9a8d9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--t);font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%)}
.hud{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.sc{flex:1;line-height:1}
.sc small{display:block;color:var(--m);font-size:14px;margin-bottom:2px}
#score{font-size:46px;color:var(--g);text-shadow:0 0 18px rgba(49,255,143,.6)}
.tm{font-size:32px;min-width:56px;text-align:center}
.tm.low{color:var(--r)}
.ib{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:18px;cursor:pointer}
#bar{height:8px;margin:0 14px 8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y));transform-origin:left}
#arena{position:relative;flex:1;overflow:hidden;border-radius:22px 22px 0 0;background:radial-gradient(70% 50% at 50% 100%,rgba(143,107,255,.18),transparent)}
#arena.bad{animation:shake .5s,flash .8s}
.o{position:absolute;left:0;top:0;touch-action:none;cursor:pointer}
.b{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--s)*.5);line-height:1;color:rgba(0,0,0,.5)}
.g .b{background:radial-gradient(circle at 30% 28%,#d3ffe6,var(--g) 40%,#0aa65a);box-shadow:0 0 28px 6px rgba(49,255,143,.5)}
.r .b{background:radial-gradient(circle at 30% 28%,#ffd0da,var(--r) 42%,#a3002a);box-shadow:0 0 30px 8px rgba(255,42,85,.6);color:rgba(255,255,255,.92);animation:pulse .5s infinite alternate}
.y .b{background:radial-gradient(circle at 30% 28%,#fff6c4,var(--y) 42%,#d98b00);box-shadow:0 0 34px 10px rgba(255,212,59,.6);animation:pulse .4s infinite alternate}
.b.pop{animation:pop .28s forwards}
.b.boom{animation:boom .8s forwards!important}
.fxt{position:absolute;font-size:30px;pointer-events:none;animation:up .6s forwards;text-shadow:0 0 12px currentColor}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(16,6,31,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov[hidden]{display:none}
#count{background:transparent;backdrop-filter:none;pointer-events:none}
#cnt{font-size:150px;color:var(--y);text-shadow:0 0 40px rgba(255,212,59,.7);animation:cnt 1s}
h1{margin:0;font-weight:400;font-size:clamp(40px,11vw,70px);line-height:.95;text-shadow:0 0 30px rgba(255,42,85,.55)}
h2{margin:0;font-weight:400;font-size:38px}
p{margin:0;color:var(--m);font-size:18px}
.lg{display:flex;gap:22px;margin:6px 0}
.lg div{display:grid;gap:8px;justify-items:center;font-size:15px;color:var(--m)}
.lg .o{position:relative;cursor:default}
.btn{font:inherit;font-size:26px;padding:14px 34px;border:0;border-radius:999px;background:linear-gradient(180deg,#6dffb0,#12c46a);color:#052a14;box-shadow:0 8px 0 #0a7d42,0 0 30px rgba(49,255,143,.4);cursor:pointer;min-width:240px}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #0a7d42}
.btn.alt{background:linear-gradient(180deg,#a58bff,#6a45e8);color:#fff;box-shadow:0 8px 0 #3d22a5,0 0 30px rgba(143,107,255,.4)}
.btn.alt:active{box-shadow:0 4px 0 #3d22a5}
.btn.gh{background:transparent;border:2px solid rgba(255,255,255,.3);box-shadow:none;color:#fff;font-size:18px;padding:10px 24px;min-width:0}
button:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.ach{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:440px;margin-top:4px}
.ach button{font:inherit;font-size:15px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--m);opacity:.5;cursor:pointer}
.ach button.on{opacity:1;color:var(--y);border-color:var(--y)}
#os{font-size:110px;line-height:1;color:var(--g);text-shadow:0 0 30px rgba(49,255,143,.6)}
#os.nb{color:var(--y);text-shadow:0 0 40px rgba(255,212,59,.8);animation:big .8s infinite alternate}
#om{max-width:340px;color:#fff;font-size:21px}
#cardimg{max-height:58vh;max-width:86%;border-radius:16px;box-shadow:0 0 40px rgba(143,107,255,.5)}
#toast{position:absolute;top:72px;left:50%;transform:translate(-50%,-20px);background:var(--y);color:#2b1d00;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:20;pointer-events:none;white-space:nowrap;font-size:17px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fxl{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.cf{position:absolute;top:45%;width:9px;height:14px;animation:cf 1.3s ease-out forwards}
@keyframes pulse{to{transform:scale(1.07)}}
@keyframes pop{to{transform:scale(1.7);opacity:0}}
@keyframes boom{40%{transform:scale(2.4);opacity:.9}to{transform:scale(4);opacity:0}}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
@keyframes cnt{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:.2}}
@keyframes big{to{transform:scale(1.1)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes flash{0%{box-shadow:inset 0 0 120px 40px rgba(255,42,85,.8)}to{box-shadow:inset 0 0 0 0 rgba(255,42,85,0)}}
@keyframes cf{0%{transform:translate(0,0)}40%{transform:translate(calc(var(--dx)*.6),var(--dy))}to{transform:translate(var(--dx),600px) rotate(720deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="sc"><small id="hb">Best 0</small><span id="score">0</span></div>
    <div class="tm" id="time">30</div>
    <button class="ib" id="mute" aria-label="Sound on or off">🔊</button>
    <button class="ib" id="pz" aria-label="Pause">⏸</button>
  </div>
  <div id="bar"><i></i></div>
  <div id="arena"></div>

  <section class="ov" id="home">
    <h1>DON’T TOUCH RED!</h1>
    <p>You have 30 seconds. Be quick, be careful.</p>
    <div class="lg">
      <div><span class="o g" style="--s:56px;width:56px;height:56px"><span class="b">✓</span></span>Tap +1</div>
      <div><span class="o r" style="--s:56px;width:56px;height:56px"><span class="b">✕</span></span>Don’t tap</div>
      <div><span class="o y" style="--s:56px;width:56px;height:56px"><span class="b">★</span></span>Bonus +5</div>
    </div>
    <button class="btn" id="play">PLAY</button>
    <button class="btn alt" id="daily" style="font-size:20px">Daily challenge</button>
    <p id="hbest"></p>
    <div class="ach" id="ach"></div>
  </section>

  <section class="ov" id="count" hidden><div id="cnt">3</div></section>

  <section class="ov" id="pause" hidden>
    <h2>Paused</h2>
    <button class="btn" id="resume">Resume</button>
    <button class="btn gh" id="restart1">Restart</button>
    <button class="btn gh" id="home1">Home</button>
  </section>

  <section class="ov" id="over" hidden>
    <h2 id="ot">Game over</h2>
    <div id="os">0</div>
    <p id="osub"></p>
    <p id="om"></p>
    <button class="btn" id="again">Play again</button>
    <button class="btn alt" id="share" style="font-size:20px">Can you beat my score?</button>
    <button class="btn gh" id="home2">Home</button>
  </section>

  <section class="ov" id="card" hidden>
    <img id="cardimg" alt="Your score card">
    <p>Press and hold the card to save or send it.</p>
    <button class="btn gh" id="cardx">Close</button>
  </section>

  <div id="toast"></div>
  <div id="fxl"></div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const arena=$('#arena'),barI=$('#bar i'),elScore=$('#score'),elTime=$('#time'),fxl=$('#fxl');
const AC=[{id:'speed',n:'Speed Demon',d:'Score 40+ in one run',i:'⚡'},{id:'perfect',n:'Perfect Reflexes',d:'15 greens in a row, none missed',i:'🎯'},{id:'dodger',n:'Red Dodger',d:'Survive all 30 seconds',i:'🛡️'},{id:'gold',n:'Golden Touch',d:'Catch 3 bonuses in one run',i:'⭐'}];
const PATS=[{n:'Red Rain',red:.12,sp:1,gold:.06,dr:1},{n:'Speed Lane',red:.04,sp:1.25,gold:.06,dr:.6},{n:'Gold Rush',red:.06,sp:1.05,gold:.16,dr:1},{n:'Zigzag',red:.05,sp:1,gold:.06,dr:2.4},{n:'Steady Storm',red:0,sp:1.1,gold:.08,dr:1.4}];
const LOSE=["Red. The one thing. You touched the one thing.","Your finger has a mind of its own.","It was red. Right there. Red.","Rest in pieces, finger.","That wasn’t a mint. It was red.","Reflexes loading… 12%","Green means go. Red means… not that."];
const WIN=["Clean run. Suspiciously clean.","Fingers of steel. Not one red touched.","You dodged every red. Show-off.","Time’s up and so is your high score. Maybe."];
const ICON={g:'✓',r:'✕',y:'★'};
const today=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let state='home',mode='normal',mod=PATS[0],objs=[],score=0,left=30,spawnT=0,cdT=0,cdN=3,last=0,rnd=Math.random,streak=0,golds=0,spawnsN=0,lastX=-999,overT=0,muted=store.get('dtr_mute',false),ac;

/* sound + haptics */
function tone(f,d=.1,type='sine',v=.14,slide=0){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function setMute(){$('#mute').textContent=muted?'🔇':'🔊'}

/* music: original chiptune loop, generated live in code (no audio files) */
const M={on:false,step:0,next:0,id:0};
const ROOT=[110,87.31,130.81,98],ARP=[[440,523.25,659.25],[349.23,440,523.25],[523.25,659.25,784],[392,493.88,587.33]];
function getAc(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
const bpm=()=>118+Math.min(score,60)*.8+(state==='play'&&left<=5?10:0);
function note(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function playStep(s,t){const c=(s>>4)&3,i=s&15,sd=60/bpm()/4;
  if(i%4===0){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.16)}
  if(i%2===0)note(ROOT[c]*(i%8===6?2:1),t,sd*1.8,'triangle',.1);
  if(i%4===2)note(1800,t,.03,'square',.012);
  note(ARP[c][[0,1,2,1][i%4]]*(i>=8&&i%4===3?2:1),t,sd*.9,'square',.035)}
function musicTick(){if(!M.on||!ac)return;while(M.next<ac.currentTime+.15){playStep(M.step,M.next);M.next+=60/bpm()/4;M.step=(M.step+1)&63}}
function musicStart(fresh){if(muted)return;const a=getAc();if(!a)return;if(fresh)M.step=0;M.on=true;M.next=a.currentTime+.05;clearInterval(M.id);M.id=setInterval(musicTick,40)}
function musicStop(){M.on=false;clearInterval(M.id)}

/* ui helpers */
function show(id){document.querySelectorAll('.ov').forEach(o=>o.hidden=o.id!==id)}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200)}
function unlock(id){const a=store.get('dtr_ach',{});if(a[id])return;a[id]=1;store.set('dtr_ach',a);const d=AC.find(x=>x.id===id);toast(d.i+' '+d.n+' unlocked!');tone(880,.2,'triangle');setTimeout(()=>tone(1175,.25,'triangle'),120)}
function bestKey(){return mode==='daily'?'dtr_d'+today():'dtr_best'}
function hud(){elScore.textContent=score;const s=Math.ceil(left);elTime.textContent=s;elTime.classList.toggle('low',left<=5);barI.style.transform='scaleX('+(left/30)+')';$('#hb').textContent='Best '+store.get(bestKey(),0)}
function goHome(){musicStop();clearTimeout(overT);state='home';mode='normal';arena.innerHTML='';objs=[];arena.classList.remove('bad');score=0;left=30;hud();
  const dm=PATS[today()%5],db=store.get('dtr_d'+today(),0);
  $('#daily').textContent='Daily challenge: '+dm.n+(db?' (best '+db+')':'');
  $('#hbest').textContent='Your best: '+store.get('dtr_best',0);
  const a=store.get('dtr_ach',{});$('#ach').innerHTML='';
  AC.forEach(d=>{const b=document.createElement('button');b.textContent=d.i+' '+d.n;b.className=a[d.id]?'on':'';b.onclick=()=>toast(d.d);$('#ach').appendChild(b)});
  show('home')}

/* game */
function startGame(m){musicStop();clearTimeout(overT);mode=m;mod=m==='daily'?PATS[today()%5]:{red:0,sp:1,gold:.07,dr:1};rnd=m==='daily'?mul(today()):Math.random;
  arena.innerHTML='';arena.classList.remove('bad');objs=[];score=0;left=30;streak=0;golds=0;spawnsN=0;lastX=-999;spawnT=.2;cdN=3;cdT=0;state='count';hud();setCnt(3);show('count')}
function setCnt(n){const c=$('#cnt');c.textContent=n;c.style.animation='none';void c.offsetWidth;c.style.animation='';tone(660,.12,'sine',.12)}
const size=()=>Math.round(Math.max(60,Math.min(94,arena.clientWidth*.17)));
function spawn(){
  const s=size(),W=arena.clientWidth,H=arena.clientHeight;spawnsN++;
  let t='g';const redP=spawnsN<4?0:Math.min(.4,.15+score*.004+mod.red);
  if(rnd()<redP)t='r';else if(spawnsN>2&&rnd()<mod.gold)t='y';
  let x=0;for(let i=0;i<6;i++){x=rnd()*(W-s);if(Math.abs(x-lastX)>s*1.05)break}lastX=x;
  const hs=Math.max(.8,Math.min(1.3,H/700)),el=document.createElement('div');
  el.className='o '+t;el.style.cssText='width:'+s+'px;height:'+s+'px;--s:'+s+'px';el.innerHTML='<div class="b">'+ICON[t]+'</div>';
  const vy=(150+Math.min(score,150)*3.2)*(1+(30-left)*.012)*mod.sp*hs*(.9+rnd()*.3);
  const o={el,t,x,y:-s,px:x,s,vy:Math.min(vy,620*hs),ph:rnd()*6.28,amp:(10+rnd()*30)*mod.dr,fq:1+rnd()*1.5};
  el.addEventListener('pointerdown',e=>{e.preventDefault();hit(o)});
  el.style.transform='translate3d('+x+'px,'+(-s)+'px,0)';arena.appendChild(el);objs.push(o)}
function fx(o,txt,color){const f=document.createElement('div');f.className='fxt';f.textContent=txt;f.style.cssText='left:'+(o.px+o.s/3)+'px;top:'+o.y+'px;color:'+color;arena.appendChild(f);setTimeout(()=>f.remove(),620)}
function hit(o){
  if(state!=='play')return;const i=objs.indexOf(o);if(i<0)return;objs.splice(i,1);
  const b=o.el.firstChild;
  if(o.t==='r'){b.classList.add('boom');end('red');return}
  b.classList.add('pop');setTimeout(()=>o.el.remove(),300);
  const pts=o.t==='y'?5:1;score+=pts;streak++;
  if(o.t==='y'){golds++;tone(1046,.12,'triangle');setTimeout(()=>tone(1397,.18,'triangle'),70);vib([15,30,15]);fx(o,'+5','#ffd43b');if(golds>=3)unlock('gold')}
  else{tone(520+Math.min(streak,14)*38,.08,'triangle');vib(12);fx(o,'+1','#31ff8f')}
  if(score>=40)unlock('speed');if(streak>=15)unlock('perfect');
  hud()}
function end(why){
  if(state!=='play')return;state='over';musicStop();
  const key=bestKey(),prev=store.get(key,0),nb=score>prev;if(nb)store.set(key,score);
  if(mode==='normal'&&nb)store.set('dtr_best',score);
  if(why==='time'){unlock('dodger');tone(784,.15,'triangle');setTimeout(()=>tone(1046,.3,'triangle'),160);vib([30,30,60])}
  else{arena.classList.add('bad');tone(190,.6,'sawtooth',.2,-130);vib([80,40,160])}
  hud();
  overT=setTimeout(()=>{if(state!=='over')return;
    $('#ot').textContent=why==='red'?'Game over':'Time’s up!';
    const os=$('#os');os.textContent=score;os.classList.toggle('nb',nb&&score>0);
    $('#osub').textContent=(mode==='daily'?'Daily challenge: '+mod.n+'. ':'')+(nb&&score>0?(prev?'New best! You beat '+prev+'.':'First score on the board!'):prev>score?(prev-score+1)+' more to beat your best of '+prev+'.':'Tap a green to get on the board.');
    const L=why==='red'?LOSE:WIN;$('#om').textContent=L[Math.floor(Math.random()*L.length)];
    show('over');if(nb&&score>0)confetti()},why==='red'?800:300)}
function confetti(){const c=['#31ff8f','#ffd43b','#ff2a55','#8f6bff'];for(let i=0;i<46;i++){const e=document.createElement('b');e.className='cf';e.style.cssText='left:'+(40+Math.random()*20)+'%;--dx:'+((Math.random()-.5)*700)+'px;--dy:'+(-200-Math.random()*400)+'px;background:'+c[i%4];fxl.appendChild(e);setTimeout(()=>e.remove(),1400)}}
function togglePause(){if(state==='play'){state='pause';musicStop();show('pause')}else if(state==='pause'){state='play';show(null);musicStart(false)}}

function loop(ts){
  requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='count'){cdT+=dt;if(cdT>=1){cdT=0;cdN--;if(cdN<=0){state='play';show(null);tone(990,.25,'square',.1);musicStart(true)}else setCnt(cdN)}return}
  if(state!=='play')return;
  left-=dt;if(left<=0){left=0;hud();end('time');return}
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.3,.75-score*.006-(30-left)*.004)*(.8+rnd()*.4)}
  const W=arena.clientWidth,H=arena.clientHeight;
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.y+=o.vy*dt;o.ph+=dt*o.fq*2;
    o.px=Math.max(0,Math.min(W-o.s,o.x+Math.sin(o.ph)*o.amp));
    o.el.style.transform='translate3d('+o.px+'px,'+o.y+'px,0)';
    if(o.y>H){if(o.t==='g')streak=0;o.el.remove();objs.splice(i,1)}}
  hud()}

/* share card */
function card(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#2a0f4d');g.addColorStop(1,'#10061f');x.fillStyle=g;x.fillRect(0,0,1080,1350);
  const rg=x.createRadialGradient(540,500,20,540,500,420);rg.addColorStop(0,'rgba(255,42,85,.55)');rg.addColorStop(1,'rgba(255,42,85,0)');x.fillStyle=rg;x.fillRect(0,0,1080,1000);
  x.textAlign='center';const F='"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif';
  x.fillStyle='#fff';x.font='88px '+F;x.fillText('DON’T TOUCH RED!',540,160);
  const o=x.createRadialGradient(480,430,10,540,500,200);o.addColorStop(0,'#ffd0da');o.addColorStop(.45,'#ff2a55');o.addColorStop(1,'#a3002a');
  x.fillStyle=o;x.beginPath();x.arc(540,500,190,0,7);x.fill();x.fillStyle='rgba(255,255,255,.92)';x.font='200px '+F;x.fillText('✕',540,570);
  x.fillStyle='#31ff8f';x.font='300px '+F;x.fillText(String(score),540,930);
  x.fillStyle='#b9a8d9';x.font='46px '+F;x.fillText(mode==='daily'?'points in the daily challenge: '+mod.n:'points in 30 seconds',540,1010);
  x.fillStyle='#fff';x.font='74px '+F;x.fillText('Can you beat me?',540,1150);
  x.fillStyle='#ffd43b';x.font='38px '+F;x.fillText(location.host||'Play it in your browser',540,1230);return c}
async function share(){
  const text='I scored '+score+' in DON’T TOUCH RED! 🔴 Can you beat me?',url=location.href.split('#')[0],c=card();
  try{
    const blob=await new Promise(r=>c.toBlob(r,'image/png')),file=new File([blob],'dont-touch-red.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:text+' '+url});return}
    if(navigator.share){await navigator.share({text,url});return}
    throw new Error('noshare')
  }catch(e){
    if(e&&e.name==='AbortError')return;
    try{await navigator.clipboard.writeText(text+' '+url);toast('Copied! Paste it to a friend')}catch(_){}
    $('#cardimg').src=c.toDataURL('image/png');show('card')}}

/* wiring */
$('#play').onclick=()=>startGame('normal');
$('#daily').onclick=()=>startGame('daily');
$('#again').onclick=()=>startGame(mode);
$('#restart1').onclick=()=>startGame(mode);
$('#resume').onclick=togglePause;
$('#pz').onclick=togglePause;
$('#home1').onclick=goHome;$('#home2').onclick=goHome;
$('#share').onclick=share;
$('#cardx').onclick=()=>show('over');
$('#mute').onclick=()=>{muted=!muted;store.set('dtr_mute',muted);setMute();if(muted)musicStop();else if(state==='play')musicStart(false)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='p')togglePause()});
setMute();goHome();requestAnimationFrame(loop);
})();
